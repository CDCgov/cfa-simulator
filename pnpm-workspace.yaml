packages:
  - "cfasim-ui/*"
  - "docs"
  - "models"

# Pin a single Vue version. vite-svg-loader's unconstrained `vue` peer
# (>=3.2.13) otherwise resolves a second copy, which breaks reka-ui at runtime
# (duplicate @vue/runtime-core).
overrides:
  vue: "3.5.35"

# Build-script policy: don't run these packages' install scripts.
strictDepBuilds: false
allowBuilds:
  esbuild: false
  vue-demi: false
