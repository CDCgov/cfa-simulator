[package]
name = "ixa-example"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# ixa's default features include `progress_bar`, which is incompatible with
# wasm32 (the crate emits a compile_error in that combo). Keep the `logging`
# feature so the WASM-specific bits (wasm-bindgen, web-sys) referenced by
# ixa's execution_stats / logging modules are pulled in.
ixa = { version = "2.2.0", default-features = false, features = ["logging"] }
wasm-bindgen = "0.2.126"
cfasim-model = { path = "../../../../cfasim-model" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
# rand_distr stays on the 0.5 line: ixa depends on rand 0.9, and 0.6 pairs
# with rand 0.10 (mismatched sampling traits).
rand_distr = "0.5.1"
