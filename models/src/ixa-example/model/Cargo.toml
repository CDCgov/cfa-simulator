[package]
name = "ixa-example"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# This model writes its own transmission loop, so it leaves out the default
# `core_epi` feature.
ixa = { version = "5.1.0", default-features = false, features = ["logging"] }
wasm-bindgen = "0.2.130"
cfasim-model = { path = "../../../../cfasim-model" }
serde = { version = "1.0.229", features = ["derive"] }
# rand_distr must pair with ixa's rand (0.10), or the sampling traits
# mismatch.
rand_distr = "0.6.0"
