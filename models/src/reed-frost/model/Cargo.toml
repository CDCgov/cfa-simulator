[package]
name = "rust-example"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2.126"
cfasim-model = { path = "../../../../cfasim-model" }
rand = { version = "0.10.2", default-features = false }
rand_distr = { version = "0.6.0", default-features = false }
ordered-float = "5.3.0"
probability = "0.20.3"
memoize = "0.6.0"

[dev-dependencies]
assert_approx_eq = "1.1.0"
