[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cfasim-model"
version = "0.16.1"
description = "Base model class for CFA simulations"
requires-python = ">=3.11"
license = "Apache-2.0"
# Left as a floor rather than pinned: Pyodide supplies its own bundled numpy,
# and an exact pin would make micropip reject the already-loaded copy.
dependencies = ["numpy>=1.26"]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
