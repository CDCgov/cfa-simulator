[package]
name = "cfasim-model"
version = "0.12.0"
edition = "2021"
rust-version.workspace = true
description = "Model output types for cfasim simulations, in the browser (WebAssembly) or as native tasks for `cfasim serve`"
license = "Apache-2.0"
repository = "https://github.com/cdcgov/cfa-simulator"
keywords = ["wasm", "simulation"]
categories = ["wasm"]

[dependencies]
wasm-bindgen = { version = "0.2.126", optional = true }
js-sys = { version = "0.3.103", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.150", optional = true }

[features]
default = ["wasm"]
# Browser models: `into_js` / `model_outputs` through wasm-bindgen.
wasm = ["dep:wasm-bindgen", "dep:js-sys"]
# Native task worker for `cfasim serve`: the `tasks` and `outputs_file` modules.
tasks = ["dep:serde", "dep:serde_json"]

[[example]]
name = "demo_tasks"
required-features = ["tasks"]
