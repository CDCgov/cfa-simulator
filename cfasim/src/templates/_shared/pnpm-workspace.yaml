# pnpm reads project settings here (pnpm 11 no longer reads the "pnpm" field
# in package.json).
#
# Build-script policy: don't run vue-demi's install script.
strictDepBuilds: false
allowBuilds:
  vue-demi: false
{% if local_ui_dir %}
# e2e only: link the local working-tree cfasim-ui packages instead of the
# published ones, so typecheck/render tests exercise the current source.
overrides:
  cfasim-ui: "file:{{ local_ui_dir }}/cfasim-ui/cfasim-ui"
  "@cfasim-ui/components": "file:{{ local_ui_dir }}/cfasim-ui/components"
  "@cfasim-ui/charts": "file:{{ local_ui_dir }}/cfasim-ui/charts"
  "@cfasim-ui/shared": "file:{{ local_ui_dir }}/cfasim-ui/shared"
  "@cfasim-ui/wasm": "file:{{ local_ui_dir }}/cfasim-ui/wasm"
  "@cfasim-ui/pyodide": "file:{{ local_ui_dir }}/cfasim-ui/pyodide"
  "@cfasim-ui/theme": "file:{{ local_ui_dir }}/cfasim-ui/theme"
{% endif %}
