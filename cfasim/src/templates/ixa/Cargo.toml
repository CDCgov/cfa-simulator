[package]
name = "{{ project_name }}"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# The default features are `logging` and `core_epi` (the transmission loop
# used in `src/model.rs`); both build for wasm32.
ixa = "5.0.0"
wasm-bindgen = "0.2.126"
cfasim-model = "{{ cfasim_version }}"
serde = { version = "1.0.229", features = ["derive"] }
# rand_distr must pair with ixa's rand (0.10), or the sampling traits
# mismatch.
rand_distr = "0.6.0"
{% if local_ui_dir %}
# e2e only: resolve cfasim-model from the local working tree instead of
# crates.io, so tests never depend on the current version being published
# (during a release, the version bump lands before the registry does).
[patch.crates-io]
cfasim-model = { path = "{{ local_ui_dir }}/cfasim-model" }
{% endif %}
