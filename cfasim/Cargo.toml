[package]
name = "cfasim"
version = "0.8.1"
edition = "2021"
rust-version.workspace = true
description = "CLI for scaffolding interactive simulations using Python, Rust, and WebAssembly"
license = "Apache-2.0"
repository = "https://github.com/CDCgov/cfa-simulator"

[dependencies]
anyhow = "1.0.104"
axoupdater = { version = "0.10.0", features = ["blocking"] }
clap = { version = "4.6.2", features = ["derive"] }
cliclack = "0.5.5"
flate2 = "1.1.9"
home = "0.5.12"
include_dir = "0.7.4"
is_ci = "1.2.0"
minijinja = "2.21.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
tar = "0.4.46"
tokio = { version = "1.53.0", features = ["rt", "time", "net"] }
toml_edit = "0.25.13"
ureq = "3.3.0"

[dev-dependencies]
tempfile = "3.27.0"
