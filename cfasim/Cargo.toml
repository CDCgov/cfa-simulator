[package]
name = "cfasim"
version = "0.11.0"
edition = "2021"
rust-version.workspace = true
description = "CLI for scaffolding interactive simulations using Python, Rust, and WebAssembly"
license = "Apache-2.0"
repository = "https://github.com/CDCgov/cfa-simulator"

[dependencies]
anyhow = "1.0.104"
axoupdater = { version = "0.10.0", features = ["blocking"] }
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.2", features = ["derive"] }
cliclack = "0.5.5"
flate2 = "1.1.9"
home = "0.5.12"
include_dir = "0.7.4"
is_ci = "1.2.0"
mime_guess = "2.0.5"
minijinja = "2.21.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
tar = "0.4.46"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "process", "io-util", "signal", "sync", "fs", "time", "net"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.19", features = ["io"] }
toml_edit = "0.25.13"
tower-http = { version = "0.6.11", features = ["fs", "cors"] }
ureq = "3.3.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[dev-dependencies]
tempfile = "3.27.0"
