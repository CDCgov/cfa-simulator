name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: k88hudson/setup-plz@v1
      - uses: ./.github/actions/setup-node
      - run: plz format
      - run: plz typecheck

  lint-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: k88hudson/setup-plz@v1
      - uses: ./.github/actions/setup-rust
      - run: plz cli format
      - run: plz cli lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: k88hudson/setup-plz@v1
      - uses: ./.github/actions/setup-node
      - run: plz test

  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: k88hudson/setup-plz@v1
      - uses: ./.github/actions/setup-rust
      - run: plz cli test

  test-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: k88hudson/setup-plz@v1
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-playwright
      - run: plz docs test

  test-cli-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: k88hudson/setup-plz@v1
      - uses: ./.github/actions/setup-node
      - uses: ./.github/actions/setup-rust
      - uses: astral-sh/setup-uv@v7
      - uses: ./.github/actions/setup-playwright
      - run: cargo build -p cfasim
      - run: plz cli e2e

  test-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: k88hudson/setup-plz@v1
      - uses: ./.github/actions/setup-node
      - uses: astral-sh/setup-uv@v7
      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/setup-playwright
      - run: echo "week=$(date +%G-W%V)" >> "$GITHUB_OUTPUT"
        id: week
      - uses: actions/cache@v5
        with:
          path: .cache/nssp_ed_raw.csv
          key: nssp-ed-data-${{ steps.week.outputs.week }}
          restore-keys: |
            nssp-ed-data-
      - run: uv run scripts/fetch_nssp_ed.py
      - run: plz models test
